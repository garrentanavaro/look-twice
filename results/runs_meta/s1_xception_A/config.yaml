  label_smoothing: 0.05
  pos_weight: null
train:
  amp: true
  grad_clip: null
  monitor: val_auc
  epochs: 20
  early_stop_patience: 5
recipe: A
optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 16
sched:
  name: constant
run_name: s1_xception_A
